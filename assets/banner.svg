<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06090F" />
      <stop offset="55%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <pattern id="grid1" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#30363D" stroke-width="0.6" stroke-opacity="0.45" />
    </pattern>
    <radialGradient id="glow1" cx="78%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#06090F" stop-opacity="0" />
    </radialGradient>

    <style>
      /* Smooth typing and cycling animation strictly in SVG CSS for GitHub */
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 0.85s infinite;
      }

      /* Animated 3-phrase typewriter cycle */
      @keyframes cycleText1 {
        0%, 28%   { opacity: 1; visibility: visible; }
        33%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes cycleText2 {
        0%, 32%   { opacity: 0; visibility: hidden; }
        35%, 62%  { opacity: 1; visibility: visible; }
        66%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes cycleText3 {
        0%, 65%   { opacity: 0; visibility: hidden; }
        69%, 95%  { opacity: 1; visibility: visible; }
        100%      { opacity: 0; visibility: hidden; }
      }

      .type-line-1 { animation: cycleText1 10s infinite; }
      .type-line-2 { animation: cycleText2 10s infinite; }
      .type-line-3 { animation: cycleText3 10s infinite; }

      /* Pulse animation for the live status indicator */
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.3); opacity: 1; }
      }
      .pulse-dot {
        transform-origin: 15px 14px;
        animation: pulseGlow 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="1200" height="290" rx="12" fill="url(#bg1)" stroke="#21262D" stroke-width="1.5" />
  <rect width="1200" height="290" rx="12" fill="url(#grid1)" />
  <rect width="1200" height="290" rx="12" fill="url(#glow1)" />

  <!-- Top accent gradient stroke -->
  <rect x="1" y="1" width="1198" height="2" rx="1" fill="url(#accent1)" opacity="0.85" />

  <!-- Left Column: Typography & Dynamic Typewriter -->
  <g transform="translate(56, 46)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="300" height="28" rx="14" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <circle cx="15" cy="14" r="4.5" fill="#3FB950" class="pulse-dot" />
    <text x="28" y="18" fill="#C9D1D9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="0.8">SOFTWARE ENGINEER · PARANÁ, BR</text>

    <!-- Main Name -->
    <text x="0" y="78" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">Guilherme Roncaglio</text>

    <!-- Dynamic Animated Typewriter Terminal Display -->
    <g transform="translate(0, 102)">
      <!-- Console prompt marker -->
      <text x="0" y="24" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">&gt;</text>

      <!-- Phrase 1 -->
      <g class="type-line-1">
        <text x="18" y="24" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500">
          Architecting native <tspan fill="#A855F7" font-weight="700">C# (.NET 10 / WPF)</tspan> desktop apps with local SQLite.
        </text>
      </g>

      <!-- Phrase 2 -->
      <g class="type-line-2">
        <text x="18" y="24" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500">
          Developing real-time <tspan fill="#38BDF8" font-weight="700">TypeScript PWAs</tspan> &amp; <tspan fill="#34D399" font-weight="700">SignalR WebSockets</tspan>.
        </text>
      </g>

      <!-- Phrase 3 -->
      <g class="type-line-3">
        <text x="18" y="24" fill="#E6EDF3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="500">
          Building multi-engine <tspan fill="#FACC15" font-weight="700">Python</tspan> web crawlers &amp; automated data pipelines.
        </text>
      </g>

      <!-- Flashing Terminal Cursor -->
      <rect x="625" y="10" width="8" height="18" rx="1.5" fill="#38BDF8" class="cursor" />
    </g>

    <text x="0" y="152" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
      Focused on clean architecture, asynchronous systems, and high-performance user experiences.
    </text>

    <!-- Domain Pills -->
    <g transform="translate(0, 172)">
      <rect x="0" y="0" width="144" height="28" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text x="72" y="18" text-anchor="middle" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">C# / .NET 10 / WPF</text>

      <rect x="154" y="0" width="154" height="28" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text x="231" y="18" text-anchor="middle" fill="#A5D6FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">TypeScript / PWA</text>

      <rect x="318" y="0" width="168" height="28" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text x="402" y="18" text-anchor="middle" fill="#D2A8FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">Python / Playwright</text>

      <rect x="496" y="0" width="140" height="28" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <text x="566" y="18" text-anchor="middle" fill="#7EE787" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">SQLite / SignalR</text>
    </g>
  </g>

  <!-- Right Column: Interactive Code Card -->
  <g transform="translate(760, 36)">
    <rect x="0" y="0" width="388" height="218" rx="10" fill="#0D1117" stroke="#30363D" stroke-width="1.2" />
    <rect x="0" y="0" width="388" height="34" rx="10" fill="#161B22" />
    <line x1="0" y1="34" x2="388" y2="34" stroke="#30363D" stroke-width="1" />
    <circle cx="18" cy="17" r="4.5" fill="#F85149" opacity="0.85" />
    <circle cx="33" cy="17" r="4.5" fill="#D29922" opacity="0.85" />
    <circle cx="48" cy="17" r="4.5" fill="#3FB950" opacity="0.85" />
    <text x="194" y="21" text-anchor="middle" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">caveira765 — architecture.ts</text>

    <g transform="translate(22, 56)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
      <text x="0" y="0" fill="#FF7B72">interface <tspan fill="#D2A8FF">EngineeringProfile</tspan> <tspan fill="#C9D1D9">{</tspan></text>
      <text x="18" y="24" fill="#8B949E">handle:   <tspan fill="#A5D6FF">'@Caveira765'</tspan>;</text>
      <text x="18" y="48" fill="#8B949E">desktop:  <tspan fill="#79C0FF">['.NET 10', 'WPF', 'SQLite']</tspan>;</text>
      <text x="18" y="72" fill="#8B949E">web:      <tspan fill="#79C0FF">['ASP.NET Core', 'SignalR', 'PWA']</tspan>;</text>
      <text x="18" y="96" fill="#8B949E">systems:  <tspan fill="#79C0FF">['Crawl4AI', 'Playwright', 'Java']</tspan>;</text>
      <text x="18" y="120" fill="#8B949E">status:   <tspan fill="#3FB950">'Building production software'</tspan>;</text>
      <text x="0" y="144" fill="#C9D1D9">}</text>
    </g>
  </g>
</svg>
