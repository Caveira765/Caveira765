<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0.0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.35" />
    </pattern>
    <radialGradient id="glow" cx="82%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" rx="14" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="1200" height="280" rx="14" fill="url(#grid)" />
  <rect width="1200" height="280" rx="14" fill="url(#glow)" />

  <!-- Subtle architectural geometry on right -->
  <g transform="translate(830, 38)" opacity="0.85">
    <rect x="0" y="0" width="310" height="204" rx="10" fill="#0B1120" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="20" cy="18" r="4.5" fill="#EF4444" opacity="0.8" />
    <circle cx="35" cy="18" r="4.5" fill="#F59E0B" opacity="0.8" />
    <circle cx="50" cy="18" r="4.5" fill="#10B981" opacity="0.8" />
    <line x1="0" y1="34" x2="310" y2="34" stroke="#1E293B" stroke-width="1" />
    <text x="20" y="62" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">// profile.config.ts</text>
    <text x="20" y="86" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">export const <tspan fill="#F8FAFC">engineer</tspan> = {</text>
    <text x="36" y="110" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">stack: [<tspan fill="#A5B4FC">'.NET'</tspan>, <tspan fill="#A5B4FC">'TS'</tspan>, <tspan fill="#A5B4FC">'Python'</tspan>],</text>
    <text x="36" y="132" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">focus: <tspan fill="#34D399">'Full-Stack &amp; Systems'</tspan>,</text>
    <text x="36" y="154" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">location: <tspan fill="#FBBF24">'Paraná, Brazil'</tspan></text>
    <text x="20" y="178" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">};</text>
  </g>

  <!-- Left Content -->
  <g transform="translate(64, 62)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="236" height="26" rx="13" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#10B981" />
    <text x="26" y="17" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.8">SOFTWARE ENGINEER</text>

    <!-- Main Name -->
    <text x="0" y="76" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8">Guilherme Roncaglio</text>

    <!-- Accent Bar -->
    <rect x="0" y="96" width="88" height="4" rx="2" fill="url(#accent)" />

    <!-- Subtitle -->
    <text x="0" y="132" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400">
      Building high-performance desktop applications, distributed web platforms, and automation tooling.
    </text>

    <!-- Metadata Footer -->
    <text x="0" y="164" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
      C# / .NET  ·  TypeScript  ·  Python  ·  Java  ·  SQLite / REST APIs
    </text>
  </g>
</svg>
